version: "3.9"

name: tech-knowledge-navigator

networks:
  rag-network:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  opensearch-data:
  grafana-data:
  prometheus-data:
  airflow-db:

services:
  ###########################################################################
  # FastAPI Application
  ###########################################################################

  app:
    container_name: rag-app

    build:
      context: ../../
      dockerfile: docker/app/Dockerfile

    restart: unless-stopped

    env_file:
      - ../../.env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      opensearch:
        condition: service_healthy

    volumes:
      - ../../:/app

    networks:
      - rag-network

  ###########################################################################
  # PostgreSQL
  ###########################################################################

  postgres:
    image: postgres:16

    container_name: rag-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: rag

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

      interval: 10s

      timeout: 5s

      retries: 5

    networks:
      - rag-network

  ###########################################################################
  # Qdrant
  ###########################################################################

  qdrant:
    image: qdrant/qdrant:v1.15.0

    container_name: rag-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant-data:/qdrant/storage

      - ../qdrant/config.yaml:/qdrant/config/production.yaml

    networks:
      - rag-network

  ###########################################################################
  # OpenSearch
  ###########################################################################

  opensearch:
    image: opensearchproject/opensearch:2.19.0

    container_name: rag-opensearch

    restart: unless-stopped

    environment:
      discovery.type: single-node

      plugins.security.disabled: "true"

      bootstrap.memory_lock: "true"

      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"

    ulimits:
      memlock:
        soft: -1
        hard: -1

    ports:
      - "9200:9200"

      - "9600:9600"

    volumes:
      - opensearch-data:/usr/share/opensearch/data

      - ../opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]

      interval: 20s

      timeout: 10s

      retries: 10

    networks:
      - rag-network

  ###########################################################################
  # Prometheus
  ###########################################################################

  prometheus:
    image: prom/prometheus

    container_name: rag-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - prometheus-data:/prometheus

      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - rag-network

  ###########################################################################
  # Grafana
  ###########################################################################

  grafana:
    image: grafana/grafana

    container_name: rag-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin

      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana-data:/var/lib/grafana

      - ../grafana/provisioning:/etc/grafana/provisioning

      - ../grafana/dashboards:/var/lib/grafana/dashboards

    depends_on:
      - prometheus

    networks:
      - rag-network

  ###########################################################################
  # Ollama
  ###########################################################################

  ollama:
    image: ollama/ollama

    container_name: rag-ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - rag-network

  ###########################################################################
  # Nginx
  ###########################################################################

  nginx:
    image: nginx:alpine

    container_name: rag-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - rag-network

  ###########################################################################
  # Airflow
  ###########################################################################

  airflow:
    build:
      context: ../airflow

      dockerfile: Dockerfile

    container_name: rag-airflow

    restart: unless-stopped

    ports:
      - "8081:8080"

    depends_on:
      - postgres

    volumes:
      - ../airflow/dags:/opt/airflow/dags

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__CORE__EXECUTOR: SequentialExecutor

    networks:
      - rag-network
